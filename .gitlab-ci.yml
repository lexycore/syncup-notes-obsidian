workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - test
  - build
  - publish

test:
  stage: test
  image: node:22-alpine
  tags: [docker]
  script:
    - npm ci
    - npm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

build:
  stage: build
  image: node:22-alpine
  tags: [docker]
  needs: [test]
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - main.js
      - manifest.json
      - styles.css
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

publish:
  stage: publish
  image: node:22-alpine
  tags: [docker]
  needs: [build]
  variables:
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache git github-cli
    - sh scripts/publish-github.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
